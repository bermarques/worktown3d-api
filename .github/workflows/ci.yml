name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The Node lines package.json "engines" supports.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci # also generates the Prisma client (postinstall)

      - name: Build
        run: npm run build

      # Compiling isn't enough for a Nest app: dependency injection and module loading only fail when it starts.
      - name: Start the built server (demo mode)
        run: |
          npm run demo > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -H 'Host: localhost:3000' http://127.0.0.1:3001/api/status || { cat server.log; exit 1; }
